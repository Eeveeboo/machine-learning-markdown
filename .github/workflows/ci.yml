name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Build workspace
        run: cargo build --workspace

      - name: Lint
        run: cargo clippy --workspace -- -D warnings 2>/dev/null || cargo clippy --workspace

      - name: Test
        run: cargo test --workspace

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Validate grammar
        working-directory: grammars/mlmd-grammar
        run: |
          npm install
          tree-sitter generate
          tree-sitter test
