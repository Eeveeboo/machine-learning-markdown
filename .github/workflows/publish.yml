name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Build release
        run: cargo build --release -p mlmd

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlmd-${{ runner.os }}
          path: target/release/mlmd
