[package]
name = "mlmd"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "mlmd"
path = "src/main.rs"

[dependencies]
mlmd-core = { path = "../mlmd-core" }
mlmd-builtin-plugins = { path = "../mlmd-builtin-plugins" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[dev-dependencies]
mlmd-builtin-plugins = { path = "../mlmd-builtin-plugins" }
