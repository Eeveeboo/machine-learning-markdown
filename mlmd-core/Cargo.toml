[package]
name = "mlmd-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
dynamic-plugins = ["libloading"]
wasm-plugins = ["wasmtime"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = { version = "0.8", optional = true }
wasmtime = { version = "14", optional = true }
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std"] }
