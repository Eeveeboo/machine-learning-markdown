[project]
name = "mlmd-examples-tests"
version = "0.1.0"
description = "Tests for MLMD-generated Python models"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8",
    "torch>=2.0",
    "tensorflow>=2.13",
]

[tool.pytest.ini_options]
python_files = ["*_test.py"]

# This is a test-only project — nothing to distribute.
[tool.setuptools]
packages = []
